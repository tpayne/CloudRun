# This workflow will build a Java project with Maven
# For more information see: https://help.github.com/actions/language-and-framework-guides/building-and-testing-java-with-maven

name: Java CI with Docker

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Test build
      run: |
        cd samples && docker build .

  docker-build:
    runs-on: ubuntu-latest
    needs: build
    
    steps:
    - uses: actions/checkout@v4
    - name: Login to DockerHub...
      run: |
        echo ${{ secrets.DOCKERHUB_PASSWORD }} | \
          docker login -u ${{ secrets.DOCKERHUB_USERNAME }} --password-stdin
    - name: Build SimpleSpringApp with Docker
      run: |
        (cd samples/ && \
         docker build . -f SimpleSpringApp/Dockerfile -t ${{ secrets.DOCKERHUB_USERNAME }}/cloudrun-simplespringapp:1.0 && \
         docker push ${{ secrets.DOCKERHUB_USERNAME }}/cloudrun-simplespringapp:1.0)
    - name: Build FileSampleApp with Docker
      run: |
        (cd samples/ && \
         docker build . -f FileSampleApp/Dockerfile -t ${{ secrets.DOCKERHUB_USERNAME }}/cloudrun-filesampleapp:1.0 && \
         docker push ${{ secrets.DOCKERHUB_USERNAME }}/cloudrun-filesampleapp:1.0)     
    - name: Build StorageGCSSample with Docker
      run: |
        (cd samples/ && \
         docker build . -f StorageGCSSample/Dockerfile -t ${{ secrets.DOCKERHUB_USERNAME }}/cloudrun-storagesampleapp:1.0 && \
         docker push ${{ secrets.DOCKERHUB_USERNAME }}/cloudrun-storagesampleapp:1.0)          
    - name: Build GCESample with Docker
      run: |
        (cd samples/ && \
         docker build . -f GCESample/Dockerfile -t ${{ secrets.DOCKERHUB_USERNAME }}/cloudrun-gcesampleapp:1.0 && \
         docker push ${{ secrets.DOCKERHUB_USERNAME }}/cloudrun-gcesampleapp:1.0)
